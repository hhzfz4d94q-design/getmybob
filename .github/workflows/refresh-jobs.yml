name: Refresh jobs and deploy dashboard

# Run every 6 hours, on manual trigger, or via repository_dispatch (lets the
# probe / other tooling kick a refresh without needing actions:write).
on:
  schedule:
    - cron: "0 */2 * * *"  # every 2h (12 runs/day) — increase to "0 * * * *" if Actions minutes allow
  workflow_dispatch: {}
  repository_dispatch:
    types: [refresh-jobs]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch jobs and generate dashboard
        id: scrape
        shell: bash
        run: |
          export PYTHONUNBUFFERED=1
          set +e  # don't fail-fast — we want to capture the full log even on crash
          python3 fetch_jobs.py > /tmp/refresh.log 2>&1
          PYEXIT=$?
          echo "Python exit code: $PYEXIT"
          echo "Log lines: $(wc -l < /tmp/refresh.log)"
          echo "::group::Refresh output (tail 200 lines)"
          tail -n 200 /tmp/refresh.log
          echo "::endgroup::"
          if [ "$PYEXIT" = "0" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          # Capture full log into a tracked file so we can read it back
          # via git pull even when GH log endpoints are blocked.
          mkdir -p .refresh-debug
          cp /tmp/refresh.log .refresh-debug/LAST_RUN.log
          echo "$PYEXIT" > .refresh-debug/LAST_EXIT_CODE
          echo "Captured $(wc -l < .refresh-debug/LAST_RUN.log) lines, exit=$PYEXIT"

      - name: Commit refresh log so we can read it back
        if: always()
        run: |
          mkdir -p .refresh-debug
          if [ ! -f .refresh-debug/LAST_RUN.log ]; then
            echo "no log produced" > .refresh-debug/LAST_RUN.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .refresh-debug/LAST_RUN.log .refresh-debug/LAST_EXIT_CODE 2>/dev/null
          if git diff --cached --quiet; then
            echo "Log file unchanged."
          else
            git commit -m "refresh-debug: capture LAST_RUN.log (auto)"
            git pull --rebase origin main 2>/dev/null || true
            git push origin main || echo "push failed (non-fatal)"
          fi

      - name: Fail if scrape did not complete
        if: steps.scrape.outputs.status != 'ok'
        run: |
          echo "::error::Scrape did not complete — see .refresh-debug/LAST_RUN.log on main."
          exit 1

      - name: Ingestion staleness gate (fail loudly if scrape wrote ~nothing)
        run: |
          python3 - <<'PYEOF'
          import sqlite3, sys
          from datetime import datetime, timedelta, timezone
          conn = sqlite3.connect("jobs.db")
          mx = conn.execute("SELECT MAX(last_seen) FROM jobs").fetchone()[0] or "none"
          cutoff = (datetime.now(timezone.utc) - timedelta(hours=24)).isoformat()
          fresh = conn.execute("SELECT COUNT(*) FROM jobs WHERE last_seen >= ?", (cutoff,)).fetchone()[0]
          print(f"max(last_seen)={mx}  rows touched in last 24h={fresh}")
          if fresh < 100:
              print("::error::Ingestion stale - the scrape barely wrote any rows. A silent scraper regression (like the _strip_html or _normalize_title NameErrors) is the likely cause. Refusing to deploy stale dashboards. See .refresh-debug/LAST_RUN.log on main.")
              sys.exit(1)
          PYEOF

      - name: Pre-deploy smoke gate (blocks bad output from shipping)
        run: |
          set -e
          python3 scripts/validate_dashboard_js.py
          python3 tests/test_scoring.py
          python3 tests/test_catalog_integrity.py
          python3 tests/test_scrapers_fixture.py
          python3 tests/test_match_goldens.py
          python3 tests/test_wizard_v3.py
          if command -v node >/dev/null 2>&1; then
            node tests/test_sprint_reminder.mjs
            node tests/test_align_pool.mjs
            # P2 e2e: install jsdom once, then run dashboard render gate
            npm install --silent --no-save jsdom 2>&1 | tail -1 || true
            node tests/test_e2e_dashboard.mjs
          else
            echo "node not available — skipping sprint reminder + align-pool + e2e tests"
          fi

      - name: Commit updated per-user dashboards and jobs.db
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git add reports/ 2>/dev/null || true
          for f in *.html; do
            if [ "$f" != "index.html" ] && [ "$f" != "landing.html" ]; then
              git add "$f"
            fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "auto: refresh dashboard $(date -u +'%Y-%m-%dT%H:%MZ')"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push attempt $i failed, rebasing and retrying..."
              git fetch origin main
              git rebase origin/main || git rebase --abort || true
              sleep 3
            done
            echo "::error::Could not push after 3 attempts"
            exit 1
          else
            echo "No changes to commit"
          fi
