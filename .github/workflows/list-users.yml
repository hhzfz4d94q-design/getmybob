name: List users (admin one-off)

# Calls /admin/users on the Worker to list all account emails.
# Commits the result to reports/users_TIMESTAMP.json so it's readable.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call /admin/users and save
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
        run: |
          set -e
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::WORKER_ADMIN_KEY secret is not set"
            exit 1
          fi
          mkdir -p reports
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="reports/users_${TS}.json"
          curl -sS -H "X-Admin-Key: $ADMIN_KEY" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/admin/users" \
            -o "$OUT"
          # Sanity print
          python3 -c "
          import json
          d = json.load(open('$OUT'))
          users = d.get('users', [])
          print(f'Wrote {len(users)} users to $OUT')
          for u in users[:20]:
              print(f\"  {u.get('slug','?'):25s}  {u.get('email','(none)')}\")
          "
      - name: Commit
        run: |
          git config user.email "admin-list@getmemyjob.local"
          git config user.name "admin-list-bot"
          git add reports/users_*.json
          git commit -m "auto: user list snapshot" || echo "nothing to commit"
          git push
