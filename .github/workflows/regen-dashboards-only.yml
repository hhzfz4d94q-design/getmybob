name: Regenerate per-user dashboards (no scrape)

# Re-renders every per-user *.html from the existing jobs.db using the
# current dashboard/template.py. Skips the slow + fragile scrape step in
# refresh-jobs.yml — use this when you've changed the dashboard template
# or fixed a JS bug and want it live in minutes, not on the 2h cron.
#
# Does NOT touch jobs.db, index.html, or landing.html.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [regen-dashboards]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sanity-check JS in current template
        run: python3 scripts/validate_dashboard_js.py

      - name: Snapshot existing dashboard size (for diff sanity)
        run: |
          echo "BEFORE: amit-arora.html = $(wc -c < amit-arora.html 2>/dev/null || echo MISSING) bytes"
          echo "BEFORE: has new marker? $(grep -c maxPerCompanyFilter amit-arora.html 2>/dev/null || echo 0)"

      - name: Regenerate every user dashboard
        id: regen
        shell: bash
        run: |
          export PYTHONUNBUFFERED=1
          # Write python to a file (heredoc + pipe is ambiguous in bash)
          cat > /tmp/regen.py <<'PY'
          import sys, os, traceback
          sys.path.insert(0, '.')
          try:
              from fetch_jobs import generate_all_dashboards, get_conn
              print("[regen] imported ok", flush=True)
              conn = get_conn()
              print("[regen] db connected", flush=True)
              generate_all_dashboards(conn)
              conn.close()
              print("[regen] DONE", flush=True)
          except Exception as e:
              print("[regen] FATAL: " + repr(e), flush=True)
              traceback.print_exc()
              sys.exit(1)
          PY
          python3 /tmp/regen.py > /tmp/regen.log 2>&1
          PYEXIT=$?
          echo "Python exit code: $PYEXIT"
          echo "Log lines: $(wc -l < /tmp/regen.log)"
          echo "::group::Regen output (full)"
          cat /tmp/regen.log
          echo "::endgroup::"
          if [ "$PYEXIT" = "0" ] && grep -q "\[regen\] DONE" /tmp/regen.log; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "PY exit code: ${PIPESTATUS[0]}"
          # Save full log + last 200 lines into a tracked file so we can read
          # it back from the API even when the run's log endpoint is blocked.
          mkdir -p .regen-debug
          cp /tmp/regen.log .regen-debug/LAST_RUN.log || echo "no log produced" > .regen-debug/LAST_RUN.log
          echo "Captured $(wc -l < .regen-debug/LAST_RUN.log) lines of output."
          if grep -q "\[regen\] DONE" .regen-debug/LAST_RUN.log; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "::group::Regen failure tail"
            tail -n 60 .regen-debug/LAST_RUN.log
            echo "::endgroup::"
          fi

      - name: Commit regen log so we can read it back
        if: always()
        run: |
          mkdir -p .regen-debug
          if [ -f /tmp/regen.log ]; then
            cp /tmp/regen.log .regen-debug/LAST_RUN.log
          else
            echo "no log produced" > .regen-debug/LAST_RUN.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .regen-debug/LAST_RUN.log
          if git diff --cached --quiet; then
            echo "Log file unchanged."
          else
            git commit -m "regen-debug: capture LAST_RUN.log (auto)"
            git push origin main || true
          fi

      - name: Fail if regen did not finish
        if: steps.regen.outputs.status != 'ok'
        run: |
          echo "::error::Regen did not complete — see .regen-debug/LAST_RUN.log on main."
          exit 1


      - name: Verify amit-arora.html got regenerated with new template
        run: |
          echo "AFTER: amit-arora.html = $(wc -c < amit-arora.html) bytes"
          echo "AFTER: has new marker? $(grep -c maxPerCompanyFilter amit-arora.html || echo 0)"
          if ! grep -q maxPerCompanyFilter amit-arora.html; then
            echo "::error::amit-arora.html was NOT regenerated with the new template — the regen step ran but produced stale output. Aborting commit."
            ls -la *.html | head -20
            exit 1
          fi
          echo "::notice::Template markers present — regen succeeded."


      - name: Commit + push regenerated dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage every per-user *.html — skip index.html and landing.html
          for f in *.html; do
            if [ "$f" != "index.html" ] && [ "$f" != "landing.html" ]; then
              git add "$f" || true
            fi
          done
          if git diff --cached --quiet; then
            echo "No template-driven changes detected — nothing to push."
            exit 0
          fi
          git commit -m "Regenerate per-user dashboards from current template (no scrape)"
          git push origin main
