name: Regenerate AI profiles

# One-button utility: walks every user in the Worker's /users registry
# and POSTs /regenerate-profile with the X-Admin-Key. Re-runs the
# size-aware Anthropic prompt and saves a fresh skills_profile +
# targetCompanies for each.
#
# Auth: prefers the WORKER_ADMIN_KEY GitHub secret (durable). Falls back
# to an admin_key passed via workflow_dispatch input for one-off use.

on:
  workflow_dispatch:
    inputs:
      user_slug:
        description: 'Which user to regen? "all" loops every user.'
        required: true
        default: 'all'
      admin_key:
        description: 'X-Admin-Key (leave empty to use WORKER_ADMIN_KEY secret)'
        required: false
        default: ''
  repository_dispatch:
    types: [regen-profiles]

env:
  WORKER_URL: https://cool-darkness-dce5.tr6jz6v7wg.workers.dev
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve auth + slug
        id: cfg
        env:
          INPUT_KEY: ${{ github.event.inputs.admin_key }}
          SECRET_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
        run: |
          KEY="${INPUT_KEY:-$SECRET_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::No admin key — set WORKER_ADMIN_KEY secret or pass admin_key input"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          SLUG="${{ github.event.inputs.user_slug || github.event.client_payload.user_slug || 'all' }}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Run regen
        env:
          WORKER_URL: ${{ env.WORKER_URL }}
          ADMIN_KEY: ${{ steps.cfg.outputs.key }}
        run: python3 scripts/regen_profiles.py "${{ steps.cfg.outputs.slug }}"

      - name: Commit regen report
        if: always()
        run: |
          git config user.email "actions-bot@getmemyjob.local"
          git config user.name "Regen-profiles workflow"
          git add reports/
          if git diff --staged --quiet; then
            echo "no report to commit"
          else
            git commit -m "auto: regen profiles report"
            git push
          fi
