name: Push contacts to worker (per user)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'User slug (e.g. geetu)'
        required: true
        default: 'geetu'

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push contacts
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          SLUG: ${{ github.event.inputs.slug }}
          WORKER_URL: https://cool-darkness-dce5.tr6jz6v7wg.workers.dev
        run: |
          echo "## push-contacts $SLUG" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/push_contacts.py 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          EXIT=${PIPESTATUS[0]}
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "exit_code: $EXIT" >> $GITHUB_STEP_SUMMARY
          exit $EXIT
