name: Push contacts to worker (per user)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'User slug (e.g. geetu)'
        required: true
        default: 'geetu'

env:
  WORKER_URL: https://cool-darkness-dce5.tr6jz6v7wg.workers.dev

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push contacts
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          SLUG: ${{ github.event.inputs.slug }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::WORKER_ADMIN_KEY secret missing"
            exit 1
          fi
          python3 scripts/push_contacts.py
