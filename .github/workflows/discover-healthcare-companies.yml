name: Discover healthcare companies (AI)

# Asks Claude for mid-stage healthcare leadership employers — biased toward
# 200-2000 employee Series B-D + post-IPO mid-cap that hire senior product /
# transformation / GRC leaders publicly. Output merges into the catalogs.
#
# Run: Actions → "Discover healthcare companies (AI)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many companies to discover (50-300)'
        required: true
        default: '200'
      focus:
        description: 'Focus band'
        required: true
        default: 'mid-stage'
        type: choice
        options:
          - mid-stage
          - enterprise
          - mixed

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count }}
          FOCUS: ${{ github.event.inputs.focus }}
        run: python3 scripts/discover_healthcare.py
      - name: Commit discovered companies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add healthtech_companies.json companies.json
          if git diff --cached --quiet; then
            echo "No new companies."
          else
            git commit -m "AI-discovered healthcare companies (focus=${{ github.event.inputs.focus }}, count=${{ github.event.inputs.count }})"
            git push origin main
          fi
