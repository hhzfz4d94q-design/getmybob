name: Manage Cloudflare Worker (dump / deploy)

# Two-mode utility for editing the cool-darkness-dce5 Worker without
# the Cloudflare dashboard's flaky Monaco editor.
#
# - dump:   GET the current Worker source from Cloudflare, commit it
#           to the repo as worker_current.js so it can be reviewed/edited.
# - deploy: take worker_target.js from the repo and PUT it back via
#           the /content endpoint, preserving secrets and bindings.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dump (read current source) or deploy (push worker_target.js)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - dump
          - deploy
  repository_dispatch:
    types: [manage-worker]

env:
  CF_ACCOUNT_ID: 76598c8a5c8c7abbaed5c4292c363e09
  WORKER_NAME: cool-darkness-dce5
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode || github.event.client_payload.mode || 'deploy' }}"
          echo "value=$M" >> "$GITHUB_OUTPUT"
          echo "Running in mode: $M"

      - name: Dump current Worker source
        if: steps.mode.outputs.value == 'dump'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -o /tmp/multipart.raw
          python3 scripts/parse_cf_worker.py /tmp/multipart.raw worker_current.js

      - name: Deploy worker_target.js (with diagnostic dump)
        if: steps.mode.outputs.value == 'deploy'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          if [ ! -f worker_target.js ]; then
            echo "::error::worker_target.js missing — nothing to deploy"
            exit 1
          fi
          BOUNDARY="cowork-$(date +%s)"
          {
            printf -- '--%s\r\n' "$BOUNDARY"
            printf 'Content-Disposition: form-data; name="metadata"; filename="metadata.json"\r\n'
            printf 'Content-Type: application/json\r\n\r\n'
            printf '{"main_module":"worker.js"}'
            printf '\r\n--%s\r\n' "$BOUNDARY"
            printf 'Content-Disposition: form-data; name="worker.js"; filename="worker.js"\r\n'
            printf 'Content-Type: application/javascript+module\r\n\r\n'
            cat worker_target.js
            printf '\r\n--%s--\r\n' "$BOUNDARY"
          } > /tmp/upload.body
          echo "Upload body size: $(wc -c </tmp/upload.body) bytes"
          curl -sS -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: multipart/form-data; boundary=$BOUNDARY" \
            --data-binary @/tmp/upload.body \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/content" \
            -o /tmp/deploy.json
          echo "=== Upload response ==="
          cat /tmp/deploy.json
          python3 -c "import json; d=json.load(open('/tmp/deploy.json')); assert d.get('success'), d; print('Upload OK (new version created).')"

          # Cloudflare Workers Versioning: /content creates a new version
          # but does NOT activate it. We must explicitly deploy it.
          echo "=== Activating new version ==="
          curl -sS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?per_page=1"             -o /tmp/versions.json
          cat /tmp/versions.json
          VERSION_ID=$(python3 -c "import json; d=json.load(open('/tmp/versions.json')); print(d['result']['items'][0]['id'])")
          echo "New version_id: $VERSION_ID"
          curl -sS -X POST             -H "Authorization: Bearer $CF_TOKEN"             -H "Content-Type: application/json"             -d "{\"strategy\":\"percentage\",\"versions\":[{\"version_id\":\"$VERSION_ID\",\"percentage\":100}]}"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"             -o /tmp/activate.json
          echo "=== Activation response ==="
          cat /tmp/activate.json
          python3 -c "import json; d=json.load(open('/tmp/activate.json')); assert d.get('success'), d; print('Version activated — live now.')"

          # === DIAGNOSTIC DUMP ===
          # List all recent versions so we can see what we have
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?per_page=10" \
            -o /tmp/all_versions.json
          # Get current deployments
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=5" \
            -o /tmp/deployments.json
          # Hit the actual worker URL to see what's served
          sleep 3
          curl -sS -i "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/?bust=$(date +%s)" \
            -o /tmp/live_root.txt || echo "live fetch failed" > /tmp/live_root.txt
          curl -sS -i "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/api/auth/me?bust=$(date +%s)" \
            -o /tmp/live_me.txt || echo "live fetch failed" > /tmp/live_me.txt

          # Write everything to a file in the repo
          {
            echo "# Worker deploy diagnostic — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## 1. Upload response (PUT /content)"
            echo ""
            echo '\`\`\`json'
            cat /tmp/deploy.json
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 2. New version_id picked from /versions?per_page=1"
            echo ""
            echo "VERSION_ID=$VERSION_ID"
            echo ""
            echo '\`\`\`json'
            cat /tmp/versions.json
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 3. All recent versions (last 10)"
            echo ""
            echo '\`\`\`json'
            cat /tmp/all_versions.json
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 4. Activation response (POST /deployments)"
            echo ""
            echo '\`\`\`json'
            cat /tmp/activate.json
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 5. Current deployments after activation"
            echo ""
            echo '\`\`\`json'
            cat /tmp/deployments.json
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 6. LIVE worker GET / (first 1000 bytes)"
            echo ""
            echo '\`\`\`'
            head -c 1000 /tmp/live_root.txt
            echo ""
            echo '\`\`\`'
            echo ""
            echo "## 7. LIVE worker GET /api/auth/me (first 1000 bytes)"
            echo ""
            echo '\`\`\`'
            head -c 1000 /tmp/live_me.txt
            echo ""
            echo '\`\`\`'
          } > WORKER_DIAG.md
          # Commit + push
          git config user.email "actions-bot@getmemyjob.local"
          git config user.name "Worker diag bot"
          git add WORKER_DIAG.md
          git commit -m "diag: deploy run output" || echo "no diff"
          git push || true

      - name: Commit dumped source (dump mode only)
        if: steps.mode.outputs.value == 'dump'
        run: |
          git config user.email "actions-bot@getmemyjob.local"
          git config user.name "Worker manager"
          git add worker_current.js
          if git diff --staged --quiet; then
            echo "No changes to worker_current.js"
          else
            git commit -m "auto: dump Worker source to worker_current.js"
            git push
          fi
