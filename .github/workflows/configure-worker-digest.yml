name: Configure Worker (Resend secrets + daily-digest cron)

# One-shot setup: take your RESEND_API_KEY + DIGEST_FROM as inputs, push them
# to the cool-darkness-dce5 Worker secrets via Cloudflare API, and add the
# daily 7am-ET cron trigger. Run once after you've signed up for Resend +
# verified your domain.
#
# Why this is a workflow_dispatch (not automated): so the API key isn't
# committed anywhere. Inputs are NOT persisted; Cloudflare receives them once.

on:
  workflow_dispatch:
    inputs:
      resend_api_key:
        description: 'Your Resend API key (starts with re_) — get it at resend.com → API Keys'
        required: true
      digest_from:
        description: 'From address — e.g. "getmemyjob <team@officebeatllc.com>" (domain must be verified in Resend)'
        required: true
        default: 'getmemyjob <team@officebeatllc.com>'
      cron:
        description: 'Cron expression (UTC). Default 0 11 * * * = 7am ET / 4am PT daily.'
        required: true
        default: '0 11 * * *'
  repository_dispatch:
    types: [configure-worker-digest]

env:
  CF_ACCOUNT_ID: 76598c8a5c8c7abbaed5c4292c363e09
  WORKER_NAME: cool-darkness-dce5

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mask inputs
        run: |
          echo "::add-mask::${{ github.event.inputs.resend_api_key || github.event.client_payload.resend_api_key }}"
          echo "::add-mask::${{ github.event.inputs.digest_from || github.event.client_payload.digest_from }}"

      - name: Push RESEND_API_KEY secret to Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_KEY: ${{ github.event.inputs.resend_api_key || github.event.client_payload.resend_api_key }}
        run: |
          set -e
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'name':'RESEND_API_KEY','text':os.environ['RESEND_KEY'],'type':'secret_text'}))")
          HTTP=$(curl -sS -o /tmp/cf.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")
          echo "HTTP $HTTP"
          python3 -c "import json; d=json.load(open('/tmp/cf.json')); print(json.dumps({'success':d.get('success'),'errors':d.get('errors',[]),'messages':d.get('messages',[])}))"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then exit 1; fi

      - name: Push DIGEST_FROM secret to Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGEST_FROM: ${{ github.event.inputs.digest_from || github.event.client_payload.digest_from }}
        run: |
          set -e
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'name':'DIGEST_FROM','text':os.environ['DIGEST_FROM'],'type':'secret_text'}))")
          HTTP=$(curl -sS -o /tmp/cf.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")
          echo "HTTP $HTTP"
          python3 -c "import json; d=json.load(open('/tmp/cf.json')); print(json.dumps({'success':d.get('success'),'errors':d.get('errors',[]),'messages':d.get('messages',[])}))"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then exit 1; fi

      - name: Set Cron Trigger (replaces any existing schedules)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRON: ${{ github.event.inputs.cron || github.event.client_payload.cron || '0 11 * * *' }}
        run: |
          set -e
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps([{'cron':os.environ['CRON']}]))")
          HTTP=$(curl -sS -o /tmp/cf.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules")
          echo "HTTP $HTTP"
          python3 -c "import json; d=json.load(open('/tmp/cf.json')); print(json.dumps({'success':d.get('success'),'result':d.get('result'),'errors':d.get('errors',[])}))"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then exit 1; fi

      - name: Verify configuration
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Current Worker secrets (names only) ==="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' -', s.get('name')) for s in (d.get('result') or [])]"
          echo ""
          echo "=== Current cron schedules ==="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' -', s.get('cron'), 'created:', s.get('created_on')) for s in (d.get('schedules') or d.get('result') or [])]"

      - name: Diagnose — capture raw responses to reports/digest_diag.md
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
        run: |
          mkdir -p reports
          OUT=reports/digest_diag.md
          {
            echo "# Digest diagnostic — $(date -u +'%Y-%m-%dT%H:%MZ')"
            echo ""
            echo "## /users (public)"
            echo ""
            echo '```json'
            curl -sS "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/users" 2>&1 || true
            echo ""
            echo '```'
            echo ""
            echo "## /admin/digest-trigger?user=geetu (verbose)"
            echo ""
            echo '```'
            if [ -n "$ADMIN_KEY" ]; then
              curl -isS -X POST -H "X-Admin-Key: $ADMIN_KEY" \
                "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/admin/digest-trigger?user=geetu" 2>&1 || true
            else
              echo "WORKER_ADMIN_KEY missing"
            fi
            echo ""
            echo '```'
            echo ""
            echo "## /admin/digest-trigger?user=amit-arora (verbose)"
            echo ""
            echo '```'
            if [ -n "$ADMIN_KEY" ]; then
              curl -isS -X POST -H "X-Admin-Key: $ADMIN_KEY" \
                "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/admin/digest-trigger?user=amit-arora" 2>&1 || true
            fi
            echo ""
            echo '```'
          } > "$OUT"
          cat "$OUT"

      - name: Commit diagnostic
        run: |
          git config user.email "actions-bot@getmemyjob.local"
          git config user.name  "Digest-diag workflow"
          git add reports/digest_diag.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: digest diagnostic $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: Send a test digest to verify end-to-end
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::WORKER_ADMIN_KEY secret not set — skipping test send"
            exit 0
          fi
          echo "Triggering /admin/digest-trigger for geetu (test send)…"
          HTTP=$(curl -sS -o /tmp/digest.json -w "%{http_code}" -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/admin/digest-trigger?user=geetu")
          echo "HTTP $HTTP"
          cat /tmp/digest.json
          echo ""
