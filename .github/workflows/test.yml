name: Tests (unit + dashboard + extension)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"  # 1pm UTC daily — confirms live dashboards still parse cleanly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests (fetch_jobs.py helpers)
        run: python3 tests/test_unit.py

      - name: Extension static checks (manifest + JS parse)
        run: python3 tests/test_extension.py

      - name: Dashboard render checks (pulls live geetu/amit HTML)
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/test_dashboard.py
