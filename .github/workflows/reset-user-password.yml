name: Reset user password (admin one-off)

# Calls /api/auth/admin-reset-password on the Worker using
# secrets.WORKER_ADMIN_KEY to forcibly reset a user's password.
# Writes the full response to reports/ for debugging.

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Email of the user whose password to reset'
        required: true
      new_password:
        description: 'New password (8+ chars; never logged)'
        required: true

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mask password (NOT email — email is needed in logs for debug)
        run: |
          echo "::add-mask::${{ github.event.inputs.new_password }}"

      - name: Call admin-reset-password
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: |
          set -e
          mkdir -p reports
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="reports/reset_${TS}.json"
          if [ -z "$ADMIN_KEY" ]; then
            echo '{"error":"WORKER_ADMIN_KEY secret not set"}' > "$OUT"
            cat "$OUT"
            exit 1
          fi
          PAYLOAD=$(python3 -c "import json,os;print(json.dumps({'email':os.environ['USER_EMAIL'].strip().lower(),'newPassword':os.environ['NEW_PASSWORD']}))")
          HTTP=$(curl -sS -o /tmp/raw.json -w "%{http_code}" -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/api/auth/admin-reset-password")
          echo "HTTP $HTTP"
          # Sanitize and save
          python3 -c "
          import json
          try:
              d = json.load(open('/tmp/raw.json'))
          except Exception as e:
              d = {'error':'non-json response: '+str(e),'raw':open('/tmp/raw.json').read()[:200]}
          d['_email_attempted'] = '${{ github.event.inputs.user_email }}'
          d['_http'] = '$HTTP'
          json.dump(d, open('$OUT','w'), indent=2)
          print(json.dumps(d, indent=2))
          "
          git config user.email "reset-bot@getmemyjob.local"
          git config user.name "reset-bot"
          git add "$OUT"
          git commit -m "auto: reset response snapshot ($TS)" || echo "nothing"
          git push
          if [ "$HTTP" != "200" ]; then exit 1; fi

      - name: Verify login
        if: success()
        env:
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: |
          sleep 3
          PAYLOAD=$(python3 -c "import json,os;print(json.dumps({'email':os.environ['USER_EMAIL'].strip().lower(),'password':os.environ['NEW_PASSWORD']}))")
          HTTP=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/api/auth/login")
          echo "Login verify HTTP $HTTP"
          python3 -c "
          import json
          d = json.load(open('/tmp/login.json'))
          d.pop('token', None)
          print(json.dumps(d))
          "
          if [ "$HTTP" != "200" ]; then exit 1; fi
          echo "✓ Login verified"
