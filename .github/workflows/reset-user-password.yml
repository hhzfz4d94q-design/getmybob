name: Reset user password (admin one-off)

# Calls /api/auth/admin-reset-password on the Worker using
# secrets.WORKER_ADMIN_KEY to forcibly reset a user's password.
# Intended for emergency lockout recovery.
#
# Trigger via workflow_dispatch with inputs.

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Email of the user whose password to reset'
        required: true
      new_password:
        description: 'New password (8+ chars; never logged)'
        required: true

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Mask inputs
        run: |
          echo "::add-mask::${{ github.event.inputs.user_email }}"
          echo "::add-mask::${{ github.event.inputs.new_password }}"

      - name: Call admin-reset-password endpoint
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: |
          set -e
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::WORKER_ADMIN_KEY secret is not set in the repo"
            exit 1
          fi
          if [ ${#NEW_PASSWORD} -lt 8 ]; then
            echo "::error::Password must be at least 8 characters"
            exit 1
          fi
          PAYLOAD=$(python3 -c "import json,os;print(json.dumps({'email':os.environ['USER_EMAIL'].strip().lower(),'newPassword':os.environ['NEW_PASSWORD']}))")
          HTTP=$(curl -sS -o /tmp/reset.json -w "%{http_code}" -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/api/auth/admin-reset-password")
          echo "HTTP $HTTP"
          # Print sanitized response (no password)
          python3 -c "
          import json
          d = json.load(open('/tmp/reset.json'))
          d.pop('newPassword', None)
          print(json.dumps(d))
          "
          if [ "$HTTP" != "200" ]; then
            echo "::error::Reset failed with HTTP $HTTP"
            exit 1
          fi
          echo "✓ Password reset for $USER_EMAIL"

      - name: Verify login with new password
        env:
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: |
          set -e
          sleep 3
          PAYLOAD=$(python3 -c "import json,os;print(json.dumps({'email':os.environ['USER_EMAIL'].strip().lower(),'password':os.environ['NEW_PASSWORD']}))")
          HTTP=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://cool-darkness-dce5.tr6jz6v7wg.workers.dev/api/auth/login")
          echo "Login verify HTTP $HTTP"
          python3 -c "
          import json
          d = json.load(open('/tmp/login.json'))
          d.pop('token', None)
          print(json.dumps(d))
          "
          if [ "$HTTP" != "200" ]; then
            echo "::error::Login verify failed — password reset succeeded but login broken"
            exit 1
          fi
          echo "✓ Login verified — user can sign in with new password"
