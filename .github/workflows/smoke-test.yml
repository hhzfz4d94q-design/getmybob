name: Live dashboard E2E test

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Comma-separated user slugs"
        required: false
        default: 'amit-arora,geetu'
  workflow_run:
    workflows: ["Refresh jobs and deploy dashboard"]
    types: [completed]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install puppeteer
        run: npm install puppeteer --no-save
      - name: Run E2E suite
        env:
          SITE: https://getmemyjob.officebeatllc.com
          E2E_RESULTS_DIR: reports
        run: node scripts/e2e_test.js "${{ github.event.inputs.users || 'amit-arora,geetu' }}"
        continue-on-error: false
      - name: Commit results JSON (always — even on failure)
        if: always()
        run: |
          git config user.email "actions-bot@getmemyjob.local"
          git config user.name "E2E-test workflow"
          git add reports/e2e_*.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no results to commit"; else
            git commit -m "auto: e2e test results"
            git push || true
          fi
