name: Live dashboard E2E test

# Runs the full end-to-end test suite after every refresh-jobs deploy.
# Tests every user-facing behavior: page load, function definitions,
# header button visibility, modal open/close, wizard step navigation,
# card rendering, scroll behavior. Any regression = CI red.

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Comma-separated user slugs (default: amit-arora,geetu)"
        required: false
        default: 'amit-arora,geetu'
  workflow_run:
    workflows: ["Refresh jobs and deploy dashboard"]
    types: [completed]

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install puppeteer
        run: npm install puppeteer --no-save
      - name: Run full E2E suite
        env:
          SITE: https://getmemyjob.officebeatllc.com
        run: node scripts/e2e_test.js "${{ github.event.inputs.users || 'amit-arora,geetu' }}"
