<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — getmemyjob</title>
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1817B5; --navy-deep: #1E146E; --indigo: #1817B5; --periwinkle: #5C5CE0; --midnight: #0B0828; --grad: linear-gradient(90deg, #1817B5, #5C5CE0); --grad-hero: linear-gradient(135deg, #0B0828 0%, #1E146E 40%, #1817B5 100%);
    --off-white: #FAFAFC; --ink: #1A1A2E; --muted: #666680;
    --hairline: #E5E7EE; --lilac-soft: #EEEEF8;
    --error: #C2410C; --error-bg: #FFF4ED;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.55 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink); background: var(--off-white);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  nav.top {
    background: #fff; border-bottom: 1px solid var(--hairline);
  }
  nav.top .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; max-width: 1080px; margin: 0 auto;
  }
  .logo { display: inline-flex; align-items: center; text-decoration: none; }
  .logo img { height: 38px; width: auto; display: block; }
  @media (max-width: 720px) { .logo img { height: 30px; } }

  .auth-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .auth-card {
    width: 100%; max-width: 420px; background: #fff;
    border: 1px solid var(--hairline); border-radius: 12px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(60, 60, 120, 0.06);
  }
  .auth-card h1 {
    font-size: 24px; font-weight: 700; margin: 0 0 6px 0;
    letter-spacing: -0.01em;
  }
  .auth-card .sub {
    color: var(--muted); margin: 0 0 24px 0; font-size: 14px;
  }
  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block; font-size: 13px; font-weight: 600; color: var(--ink);
    margin-bottom: 6px;
  }
  .form-row input {
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--hairline); border-radius: 6px;
    background: #fff; color: var(--ink);
    transition: border-color 0.15s;
  }
  .form-row input:focus {
    outline: none; border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(92, 92, 214, 0.12);
  }
  .submit-btn {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--navy); border: none; border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
    font-family: inherit;
  }
  .submit-btn:hover:not(:disabled) { background: var(--navy-deep); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .err {
    background: var(--error-bg); color: var(--error);
    border: 1px solid #FED7AA; border-radius: 6px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
    display: none;
  }
  .err.show { display: block; }
  .alt {
    text-align: center; margin-top: 20px; font-size: 13px;
    color: var(--muted);
  }
  .alt a { color: var(--navy); text-decoration: none; font-weight: 600; }
  .alt a:hover { text-decoration: underline; }
  footer {
    text-align: center; padding: 24px; color: var(--muted); font-size: 12px;
  }
</style>
</head>
<body>
<nav class="top">
  <div class="row">
    <a href="/landing.html" class="logo" aria-label="OfficeBeat home">
      <img src="officebeat-logo.png" alt="OfficeBeat">
    </a>
    <a href="/signup.html" style="font-size:14px;color:var(--navy);text-decoration:none;font-weight:600;">Create account</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your getmemyjob dashboard.</p>

    <div id="err" class="err" role="alert"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
    </form>

    <div class="alt">
      Don't have an account? <a href="/signup.html">Sign up</a>
    </div>
  </div>
</div>

<footer>By OfficeBeat LLC</footer>

<script>
const WORKER = 'https://cool-darkness-dce5.tr6jz6v7wg.workers.dev';
const TOKEN_KEY = 'gmj_session_token';

// If already logged in, skip the form
(async function checkExisting() {
  const tok = localStorage.getItem(TOKEN_KEY);
  if (!tok) return;
  try {
    const r = await fetch(WORKER + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + tok } });
    const j = await r.json();
    if (j.authenticated) location.replace('/dashboard.html');
  } catch (e) { /* ignore */ }
})();

const form = document.getElementById('loginForm');
const errEl = document.getElementById('err');
const btn = document.getElementById('submitBtn');

function showErr(msg) {
  errEl.textContent = msg;
  errEl.classList.add('show');
}
function clearErr() { errEl.classList.remove('show'); errEl.textContent = ''; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErr();
  btn.disabled = true; btn.textContent = 'Signing in…';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const r = await fetch(WORKER + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    let j;
    try { j = await r.json(); } catch (e) {
      const txt = await r.text().catch(() => '');
      showErr('Worker returned non-JSON (status ' + r.status + '). Did you deploy the Worker? First 80 chars: ' + txt.slice(0, 80));
      return;
    }
    if (!r.ok) { showErr(j.error || 'Login failed'); return; }
    localStorage.setItem(TOKEN_KEY, j.token);
    localStorage.setItem('gmj_user_slug', j.slug);
    localStorage.setItem('gmj_user_name', j.name);
    localStorage.setItem('gmj_user_email', j.email);
    location.replace('/dashboard.html');
  } catch (err) {
    showErr('Could not reach the server. If you just deployed the Worker, give it ~30 seconds and retry. (' + (err && err.message ? err.message : err) + ')');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
